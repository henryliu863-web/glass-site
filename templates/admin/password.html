{% extends "admin/base.html" %}
{% block content %}
<h2>修改密码</h2>
<form method="post" class="aform">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="f"><label>原密码</label><input type="password" name="old" required></div>
  <div class="f"><label>新密码</label><input type="password" name="new" required minlength="6"></div>
  <div class="f"><label>确认新密码</label><input type="password" name="new2" required minlength="6"></div>
  <div class="f"><label></label><button type="submit">保存</button></div>
</form>
{% endblock %}
